<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="application-name" content="Wild Count" />
    <meta
      name="description"
      content="Coyote系の数字推理・ブラフゲーム。夜の砂漠で動物たちと宣言合戦。"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wild Count" />
    <title>Wild Count</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Cinzel:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <!-- Replaced on mount. Visible if JS is slow/fails (avoids pure black). -->
      <div
        id="app-boot"
        style="
          box-sizing: border-box;
          min-height: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 0.75rem;
          padding: 2rem 1.25rem;
          color: #e8dcc4;
          font-family: system-ui, 'Noto Sans JP', sans-serif;
          text-align: center;
        "
      >
        <p style="margin: 0; font-size: 1.25rem; font-weight: 700; color: #e8d5a3">
          Wild Count
        </p>
        <p style="margin: 0; font-size: 0.875rem; color: #c4b49a">読み込み中…</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <noscript>
      <p
        style="
          margin: 2rem;
          color: #e8dcc4;
          font-family: system-ui, sans-serif;
          text-align: center;
        "
      >
        Wild Count を使うには JavaScript を有効にしてください。
      </p>
    </noscript>
  </body>
</html>
